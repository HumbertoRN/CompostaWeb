{% load static %}
<!-- Portada de cada sección: foto de fondo + degradado oscuro para que el texto se lea -->
{# Se usa con include y las variables: etiqueta, titulo, texto e imagen #}
<section class="relative overflow-hidden">
    <img src="{% static imagen %}" alt="" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-r from-stone-950/90 via-stone-950/70 to-stone-950/20"></div>

    <div class="relative container mx-auto px-6 py-24 md:py-32">
        <span class="inline-flex items-center px-4 py-1.5 bg-white/10 backdrop-blur-md border border-white/20 text-lime-300 text-xs font-bold uppercase tracking-widest rounded-full">
            {{ etiqueta }}
        </span>
        <h1 class="font-display mt-6 text-4xl md:text-6xl font-extrabold text-white leading-tight max-w-3xl">
            {{ titulo }}
        </h1>
        <p class="mt-5 text-lg md:text-xl text-stone-200 max-w-2xl leading-relaxed">
            {{ texto }}
        </p>
    </div>
</section>
